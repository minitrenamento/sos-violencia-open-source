name: Import sanitized UNICEF release v2

on:
  push:
    branches: [main]
    paths:
      - 'release-archive/TRIGGER2'

permissions:
  contents: write

jobs:
  import-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify archive
        shell: bash
        run: |
          set -euo pipefail
          cat release-archive/chunk-* > /tmp/release.b64
          base64 -d /tmp/release.b64 > /tmp/release.tar.xz
          echo '7607cc20e973e7525d676012c2c45dd53d645382bb963ab63ff2a6b6a80fb4b0  /tmp/release.tar.xz' | sha256sum -c -
          rm -rf /tmp/release-extract
          mkdir -p /tmp/release-extract
          tar -xJf /tmp/release.tar.xz -C /tmp/release-extract
          src=/tmp/release-extract/SOS-Violencia-UNICEF-public-release
          test -d "$src"
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -a "$src"/. ./

      - name: Commit sanitized source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish sanitized UNICEF public release'
          git push origin HEAD:main
