name: Import sanitized UNICEF release

on:
  push:
    branches: [main]
    paths:
      - 'release-archive/TRIGGER'

permissions:
  contents: write

jobs:
  import-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify archive
        shell: bash
        run: |
          set -euo pipefail
          cat release-archive/part-* > /tmp/release.b64
          base64 -d /tmp/release.b64 > /tmp/release.zip
          echo 'da7f3d8f5a22cc337b0d9194a49fca6c0b1a8086f3139ed3db753b779410bbf5  /tmp/release.zip' | sha256sum -c -
          rm -rf /tmp/release-extract
          mkdir -p /tmp/release-extract
          unzip -q /tmp/release.zip -d /tmp/release-extract
          src=/tmp/release-extract/SOS-Violencia-UNICEF-public-release
          test -d "$src"
          rm -rf release-archive
          cp -a "$src"/. ./
          rm -f .github/workflows/import-sanitized-release.yml

      - name: Commit sanitized source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish sanitized UNICEF public release'
          git push origin HEAD:main
